# --- Clé et nom du projet sur le serveur SonarQube ---
sonar.projectKey=produit-react-app
sonar.projectName=Produit React App
sonar.projectVersion=1.0

# --- Dossiers à analyser ---
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# --- Langage et encodage ---
sonar.language=js
sonar.sourceEncoding=UTF-8 

# --- Configuration des tests et de la couverture (Vitest / LCOV) ---
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/clover.xml